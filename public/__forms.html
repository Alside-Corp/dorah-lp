<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Definições de formulários</title>
  </head>
  <body>
    <form
      name="solicitar-contato"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="solicitar-contato" />
      <input type="hidden" name="subject" value="Novo contato pelo site da Dorah" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="company" />
    </form>
  </body>
</html>
